<!DOCTYPE html>
<html>
    <head>
        <title>Test</title>
        <link rel="stylesheet" href="style1.css">
    </head>

    <body>

        <div class="flexContainer">
            <div class="sideBg"></div>
            <div class="sectionContainer">
                <section class="container">
                    <div class="container-2">
                        <button type="button" id="toggle-button">
                            <h2>Toggle Mode</h2>
                        </button>
                    </div>
                    
                    <div id="number-game">
                        <div id="number">0</div>
                        <div>
                            <button id="subtract-btn">-</button>
                            <button id="add-btn">+</button>
                        </div>
                    
                    </div>

                    <div id="FAQ">
                        <h3 id="question">What is the blah of blah with many blash in baaa</h3>
                        <p id="answer">Answer</p>
                    </div>
                    
                    <div id="image-showcase">
                        <img src="" alt="">
                    </div>

                    <div id="card-Progress">
                        <div id="to-Do" class="card-Column">
                            <h2>To Do</h2>
                            <div class="card-container">
                                <div id="dishes" class="card">Dishes</div>
                            </div>
                        </div>
                        <div id="in-Progress" class="card-Column">
                            <h2>In Progress</h2>
                            <div class="card-container">
                                <div id="games" class="card">Games</div>
                            </div>
                        </div>
                        <div id="done" class="card-Column">
                            <h2>Done</h2>
                            <div class="card-container">
                                <div id="cooking" class="card">Cooking</div>
                            </div>
                        </div>

                       
                    </div>
                    <h1>wood</h1>
                     <img src="images/WoodMoreDarker.jpg" alt="">

                </section>
            </div>
            <div class="sideBg"></div>
        </div>


    </body>
    
    <script src="main1.js"></script>

</html>
